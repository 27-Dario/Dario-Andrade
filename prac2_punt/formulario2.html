            <section id="derecha">
            <article>
                <form name="formDisco" action="#" method="post" enctype="multipart/form-data">

                 <article class="columnas">
                    <fieldset class="cantante" >
                        <article  id="datosCantante">
                            <article>
                                <label>Nombre: </label>
                                <input type="text" id="nombreCantante">
                            </article>
                            
                            <article>
                                <label>Edad: </label>
                                <input type="number" id="edad" min="1" max="80">
                            </article>
                            
                            <article>
                                <label>Genero:</label>
                                <input type="radio" name="genero" id="genero" value="F">Femenino
                                <input type="radio" name="genero" id="genero" value="M">Masculino
                            </article>
                            
                            <article>
                                <label>Trayectoria: </label>
                                <select id="trayectoria" > 
                                    <option id="1">Selecciona Trayectoria en años</option>
                                    <option id="2">1 a 5 </option>
                                    <option id="3">6 a 10</option>
                                    <option id="4">11 o mas</option>
                                </select><br>
                            </article>
                        </article>
                        
                    </fieldset>
                    
                    <fieldset class="cantante">

                        <article  id="archivo">
                            <label>Archivo</label>
                            <input type="file" id="archivob">
                        </article>

                         
                    </fieldset>
                    </article>
                    <button id="boton" onclick="cantante();">Guardar</button>

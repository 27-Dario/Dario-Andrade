<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema reservacion-Hotel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4 bg-light">

    <h2>Nueva Reservación</h2>
    <form id="formReserva">
        <label for="cliente" class="form-label">Nombre del cliente:</label>
        <input type="text" id="cliente" class="form-control mb-2" placeholder="Ej. Dario Andrade">
        
        <label for="rfc" class="form-label">RFC:</label>
        <input type="text" id="rfc" class="form-control mb-2" placeholder="Ej. TOAA900101ABC" maxlength="13">
        
        <article class="row mb-2">
            <article class="col">
                <label for="adultos" class="form-label">Adultos:</label>
                <input type="text" id="adultos" class="form-control" min="1" value="0">
            </article>
            <article class="col">
                <label for="ninos" class="form-label">Niños:</label>
                <input type="text" id="ninos" class="form-control"  min="0" value="0" onchange="generarEdades();">
            </article>
        </article>

        <article id="contenedorEdades" class="mb-2"></article>
        
        <label for="tipoHab" class="form-label">Selecciona una habitación:</label>
        <article class="input-group mb-3">
            <select id="tipoHab" >
                <option value="Sencilla">Sencilla - 2 camas individuales ($1,200)</option>
                <option value="Doble">Doble - 1 matrimonial, 1 individual ($1,700)</option>
                <option value="Familiar">Familiar - 2 matrimoniales ($2,500)</option>
                <option value="Suite">Suite - 2 matrimoniales, 1 individual ($2,800)</option>
            </select>
            <button type="button" class="btn btn-secondary" onclick="agregarHabitacion();">+ Añadir</button>
        </article>

        <hr>
        <h3>Habitaciones agregadas</h3>
        <ul id="listaHabitaciones"></ul>
        
        <p id="aviso">Se cobra $500/persona si excede capacidad de personas entre las habitaciones elegidas</p>
        
        <button type="button" class="btn btn-primary" onclick="procesarEnviar();">Guardar Reservacion</button>
    </form>

    <script src="funciones.js"></script>
</body>
</html>

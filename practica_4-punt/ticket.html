<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket de Hotel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4 bg-light">

    <h2>Hotel</h2>
    <p class="fw-bold">Cliente: <span id="salidaCliente"></span></p>
    <p class="fw-bold">RFC:<span id="salidaRfc"></span></p>
    <hr>
    <h3>Detalle de la reservación:</h3>
    <ul id="salidaListaHabitaciones"></ul>
    
    <p class="fw-bold">Adultos / Niños: <span id="salidaPersonas">0 / 0</span></p>
    <p class="fw-bold">Costo extra ($500 c/u): <span id="salidaExtra">$0.00</span></p>
    <p class="fw-bold">Total a pagar: <span id="salidaTotal">$0.00</span></p>
    
    

    <script src="ticket.js"></script>
</body>
</html>
